services:
  yuan:
    image: ghcr.io/mgloc/yuan:latest
    restart: unless-stopped
    environment:
      YUAN_TRUST_PROXY: "1"
    volumes:
      - yuan-data:/data
    networks:
      - proxy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy
    depends_on:
      - yuan

networks:
  proxy:
    external: true

volumes:
  yuan-data:
  caddy-data:
  caddy-config:
